aid: spacejoy
name: Spacejoy
description: >-
  Spacejoy is an online interior design platform that pairs customers with
  professional designers to reimagine their spaces. Users share a room photo and
  requirements, then receive photo-realistic 3D renderings, curated furniture and
  decor recommendations, and shoppable design boards that link directly to
  retailers such as Wayfair, Article, Crate & Barrel, and CB2. The service covers
  living rooms, bedrooms, dining rooms, home offices, nurseries, entryways, and
  outdoor spaces, and operates an integrated storefront at shop.spacejoy.com plus
  an iOS mobile app. Spacejoy is a direct-to-consumer design service with no
  public developer program, API, or documentation surface as of this profile.
  Originally added to the API Evangelist network as a portfolio company of Accel.
